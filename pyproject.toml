[project]
name = "file-organizer"
version = "0.1.0"
description = "LangGraph tool-calling agent that sorts files into category folders by content, with human approval of every change"
readme = "README.md"
authors = [
    { name = "leo", email = "fgozman@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.0",
    "langchain-core>=1.8.1",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
file-organizer = "file_organizer.cli:main"

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1.7.10",
]
openai = [
    "langchain-openai>=1.8.0",
]
phoenix = [
    "arize-phoenix-otel>=0.17.3",
    "openinference-instrumentation-langchain>=0.1.89",
]
documents = [
    "olefile>=0.47",
    "pillow>=11",
    "pypdf>=5",
    "xlrd>=2.0.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Raised inside langgraph's SqliteStore (TTL timestamps) on Python 3.12+; not our code.
    "ignore:The default datetime adapter is deprecated:DeprecationWarning:langgraph.store.sqlite",
]

[tool.ruff]
# Ruff's default rule set changes between minor versions, so the dev dependency is
# pinned to 0.17.x: everyone (and CI) gets the same checks.
target-version = "py312"
line-length = 120  # the code base wraps at ~110; E501 is not in the default rules
src = ["src", "tests"]

[dependency-groups]
dev = [
    "olefile>=0.47",
    "pillow>=11",
    "pypdf>=5",
    "pytest>=9.2.0",
    "ruff>=0.17.6,<0.18",
    "xlrd>=2.0.1",
]
